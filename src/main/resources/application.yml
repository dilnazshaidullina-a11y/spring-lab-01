spring:
  application:
    name: spring-lab-01

server:
  port: 8080

app:
  owner: Dilnaz Shaidullina
  group: IT1-CC02504
  date-pattern: "yyyy-MM-dd HH:mm:ss"
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true

logging:
  level:
    web: INFO
    kz.iitu: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
  endpoint:
    env:
      show-values: ALWAYS
    configprops:
      show-values: ALWAYS